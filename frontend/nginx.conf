server {
  listen 10000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: cualquier ruta del frontend cae en index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API: se proxea a la URL pública del backend en Render.
  # En local (docker-compose) esto apuntaba a "backend:4000" por DNS interno
  # de Docker Compose; en Render, los servicios free no reciben tráfico por
  # red privada, así que hay que usar la URL pública real.
  location /api/ {
    proxy_pass https://gym-system-2sb4.onrender.com;
    proxy_ssl_server_name on;
    proxy_set_header Host gym-system-2sb4.onrender.com;
    proxy_http_version 1.1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
