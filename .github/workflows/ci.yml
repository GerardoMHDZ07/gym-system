name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gym
          POSTGRES_PASSWORD: gym
          POSTGRES_DB: gym_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gym"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Aplicar esquema y seed contra Postgres de CI
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql postgresql://gym:gym@localhost:5432/gym_db -v ON_ERROR_STOP=1 -f src/migrations/001_init.sql
          psql postgresql://gym:gym@localhost:5432/gym_db -v ON_ERROR_STOP=1 -f src/migrations/002_seed.sql

      - name: Type-check y build
        run: npm run build

  # Tests de contrato: levanta el backend contra el Postgres con seed y corre la
  # suite completa (los tests son de contrato contra el server vivo, sin mocks).
  contract-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gym
          POSTGRES_PASSWORD: gym
          POSTGRES_DB: gym_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gym"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://gym:gym@localhost:5432/gym_db
      JWT_SECRET: ci-secret
      PORT: 4000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Aplicar esquema y seed contra Postgres de CI
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql postgresql://gym:gym@localhost:5432/gym_db -v ON_ERROR_STOP=1 -f src/migrations/001_init.sql
          psql postgresql://gym:gym@localhost:5432/gym_db -v ON_ERROR_STOP=1 -f src/migrations/002_seed.sql

      - name: Arrancar backend y esperar health check
        run: |
          npx tsx src/index.ts > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4000/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:4000/health

      - name: Suite de tests de contrato
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Type-check y build
        run: npm run build
