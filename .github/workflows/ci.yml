name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gym
          POSTGRES_PASSWORD: gym
          POSTGRES_DB: gym_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gym"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Aplicar esquema y seed contra Postgres de CI
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql postgresql://gym:gym@localhost:5432/gym_db -v ON_ERROR_STOP=1 -f src/migrations/001_init.sql
          psql postgresql://gym:gym@localhost:5432/gym_db -v ON_ERROR_STOP=1 -f src/migrations/002_seed.sql

      - name: Type-check y build
        run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Type-check y build
        run: npm run build
