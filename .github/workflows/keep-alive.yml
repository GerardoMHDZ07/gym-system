name: Keep Supabase Alive

# Supabase pausa los proyectos free tras 7 días sin peticiones a la base de
# datos. Este workflow corre cada 3 días y manda un SELECT trivial para que
# nunca se acerque a ese límite. workflow_dispatch permite dispararlo a mano
# para probarlo sin esperar al cron.
on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente de psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Ping a Supabase (SELECT 1)
        run: psql "${{ secrets.SUPABASE_DATABASE_URL }}" -c "SELECT 1;"
