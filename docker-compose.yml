services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: gym
      POSTGRES_DB: gym_db
    # 5433 en el host: evita conflicto con un Postgres nativo que pueda ocupar 5432
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/src/migrations:/docker-entrypoint-initdb.d
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Dentro de la red de compose la DB vive en el host "db", no en localhost
      DATABASE_URL: postgres://gym:gym@db:5432/gym_db
    ports:
      - "4000:4000"
    depends_on:
      - db
  frontend:
    build: ./frontend
    restart: unless-stopped
    # nginx sirve el build y proxea /api -> backend:4000
    ports:
      - "8080:80"
    depends_on:
      - backend
volumes:
  db_data:
