apiVersion: apps/v1
kind: Deployment
metadata:
  name: gym-frontend
  namespace: gym-system
  labels:
    app: gym-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gym-frontend
  template:
    metadata:
      labels:
        app: gym-frontend
    spec:
      containers:
        - name: gym-frontend
          image: gym-frontend:local
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          volumeMounts:
            # Sobreescribe el nginx.conf horneado en la imagen con el del
            # ConfigMap de arriba — no importa qué diga el archivo original
            # dentro de la imagen, este montaje siempre gana.
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      volumes:
        - name: nginx-config
          configMap:
            name: gym-frontend-nginx-config
