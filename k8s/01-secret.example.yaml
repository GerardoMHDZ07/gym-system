apiVersion: v1
kind: Secret
metadata:
  name: gym-system-secrets
  namespace: gym-system
type: Opaque
stringData:
  DATABASE_URL: "postgres://usuario:password@host:5432/postgres"
  JWT_SECRET: "reemplaza-con-un-valor-generado-de-verdad"
  MCP_API_KEY: "reemplaza-con-un-valor-generado-de-verdad"
