# Sobreescribe /etc/nginx/conf.d/default.conf dentro del contenedor del
# frontend (vía volumeMount en el Deployment) — la MISMA imagen que usas en
# Render, sin reconstruirla, solo con la config de proxy distinta para este
# entorno: en vez de la URL pública de Render, le habla directo al Service
# interno del backend por su nombre DNS de Kubernetes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gym-frontend-nginx-config
  namespace: gym-system
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      location / {
        try_files $uri $uri/ /index.html;
      }

      location /api/ {
        proxy_pass http://gym-backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }
    }
